name: Historical alpha verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Local behavior and package / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]" build
      - name: Compile source
        run: python -m compileall -q llmtrace
      - name: Run local behavior tests
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build

# This workflow tests local fixtures and packaging. It does not validate
# live provider SDK integrations, security, SLSA provenance or PyPI publishing.
